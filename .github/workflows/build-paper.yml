name: Build working paper PDF
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile manuscript
        run: |
          mkdir -p build
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=build docs/children_project.tex
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=build docs/children_project.tex
          cp build/children_project.pdf docs/children_project.pdf
      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/children_project.pdf
          git diff --staged --quiet || git commit -m "Build verified working-paper PDF via GitHub Actions"
          git push origin HEAD:main
