name: keep-equireach-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the free Render service
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 60 "https://equireach-api.onrender.com/health" || true
